name: lmm-benchmark

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::lme4, local::.

      - name: Run repeated-measures LMM benchmark
        run: scripts/ci_lmm_benchmark.R
        shell: Rscript {0}

      - name: Publish benchmark summary
        run: cat lmm-benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmm-benchmark
          path: |
            lmm-benchmark.rds
            lmm-benchmark-summary.md
